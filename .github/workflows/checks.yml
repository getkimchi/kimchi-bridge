name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      # Second full pass in a random file/test order (a fresh seed each run), so a suite that
      # only passes in the checked-in order fails here instead of slipping through silently.
      - run: bun test --randomize
      # B3 acceptance: the worker bundle must complete hello and one pass
      # under a released kimchi binary (BUN_BE_BUN=1 kimchi --no-env-file),
      # not just under plain bun. The asset layout follows Kimchi's own
      # install.sh: kimchi_<os>_<arch>.tar.gz containing bin/kimchi.
      - name: Smoke the worker through a released kimchi binary
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          case "$(uname -m)" in
            x86_64 | amd64) arch=amd64 ;;
            *) arch=arm64 ;;
          esac
          temp="$(mktemp -d)"
          curl -fsSL "https://github.com/getkimchi/kimchi/releases/latest/download/kimchi_${os}_${arch}.tar.gz" \
            | tar -xzf - -C "$temp"
          KIMCHI_WORKER_SMOKE_BIN="$temp/bin/kimchi" bun test test/worker/kimchi-smoke.test.ts
      # bash -n checks only its first file; the rest become arguments.
      - run: for script in install.sh scripts/*.sh; do bash -n "$script"; done
      - run: sh -n scripts/install-standalone.sh
      - run: python3 -c "import plistlib; plistlib.load(open('build/entitlements.mac.plist', 'rb'))"
      - run: git diff --check
  # The worker path must run on Windows (no platform.ts, no FFI, no shell wrappers):
  # build the bundle and smoke-test that it imports, speaks the protocol and
  # refuses a mismatched parent. Full suites stay on the POSIX runners.
  worker-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: pnpm install --frozen-lockfile
      # bun test cannot run on Windows: bunfig's preload imports bridge-native
      # activity code that refuses to load outside macOS and Linux. bun run
      # skips the preload, so the smoke script drives the bundle directly.
      - run: bun run scripts/worker-windows-smoke.ts
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/package.sh v0.1.0-rc.1 dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/
